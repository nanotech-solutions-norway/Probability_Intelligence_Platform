name: PIP Reproducible Runtime Release Artifact

on:
  pull_request:
    paths:
      - ".github/workflows/pip-runtime-release-artifact.yml"
      - "contracts/**"
      - "services/pip_api/**"
      - "tests/test_runtime_release.py"
      - "tools/build_runtime_release.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pip-runtime-release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release-artifact:
    name: Build non-deploying runtime bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Validate deterministic release builder
        run: python -m unittest tests.test_runtime_release -v

      - name: Build reviewed runtime source bundle
        run: python tools/build_runtime_release.py --git-sha "${RELEASE_SHA}" --output-dir dist/runtime-release

      - name: Verify manifest and safety locks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import pathlib

          manifests = list(pathlib.Path("dist/runtime-release").glob("*.manifest.json"))
          assert len(manifests) == 1
          manifest = json.loads(manifests[0].read_text(encoding="utf-8"))
          archive = manifests[0].with_name(manifest["archive"])
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == manifest["archive_sha256"]
          assert manifest["source_git_sha"] == "${{ env.RELEASE_SHA }}"
          assert manifest["deployment_authorized"] is False
          assert manifest["execution_allowed"] is False
          assert manifest["recommendation_release_allowed"] is False
          assert manifest["bookmaker_execution_enabled"] is False
          assert manifest["real_money_betting_enabled"] is False
          print(f"source_git_sha={manifest['source_git_sha']}")
          print(f"archive_sha256={manifest['archive_sha256']}")
          print(f"file_count={len(manifest['files'])}")
          print("deployment_authorized=false")
          print("payload_included=false")
          PY

      - name: Upload reviewed source bundle and manifest
        uses: actions/upload-artifact@v4
        with:
          name: pip-runtime-${{ env.RELEASE_SHA }}
          path: dist/runtime-release/
          if-no-files-found: error
          retention-days: 30
