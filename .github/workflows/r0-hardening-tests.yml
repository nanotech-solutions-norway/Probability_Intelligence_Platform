name: R0 Reconciliation Hardening

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r0-hardening:
    runs-on: ubuntu-latest
    env:
      FEA_PIP_CONTRACT_SHA256: a2fa4bda60c4742ea353024f2e4d4bcd854345a1e6185d892c5a40c282958349
      R0_SYNTHETIC_PAYLOAD_SHA256: 62c1bd6a79aad6203fc68f889fbf7edceeb720a895b15d764c7d6968bbcf8817
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Validate shared contract integrity and safety
        run: |
          python -c "import hashlib,json,os,pathlib; p=pathlib.Path('contracts/fea_pip_shadow_contract_v2.schema.json'); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['FEA_PIP_CONTRACT_SHA256']; d=json.loads(p.read_text()); s=d['properties']['safety']['properties']; assert s['execution_allowed']['const'] is False; assert s['recommendation_release_allowed']['const'] is False; assert s['bookmaker_execution_enabled']['const'] is False; assert d['allOf'][0]['else']['properties']['probabilities']['maxItems']==0; print('shared-contract-integrity-ok')"
      - name: Validate synthetic cross-repository shadow fixture
        run: |
          python -c "import hashlib,json,os,pathlib; p=pathlib.Path('examples/r0_shadow_payload.synthetic.json'); assert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['R0_SYNTHETIC_PAYLOAD_SHA256']; d=json.loads(p.read_text()); assert d['contract_version']=='2.0.0'; assert d['data_quality']['consensus_status']=='comparable_consensus'; assert d['data_quality']['provider_count']>=2; assert d['safety']['execution_allowed'] is False; assert d['safety']['recommendation_release_allowed'] is False; print('synthetic-cross-repo-shadow-ok')"
      - name: Compile R0 Python modules and offline runners
        run: python -m compileall -q pip_core tools
      - name: Run R0-specific unit tests
        run: python -m unittest tests.test_phase16h_secret_scan tests.test_provider_consensus tests.test_shadow_payload tests.test_r0_shadow_gate_runner -v
