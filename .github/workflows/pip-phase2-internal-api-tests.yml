name: PIP Phase 2 Internal API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  phase2-internal-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run PIP unittest suite
        run: python -m unittest discover -s tests
      - name: Validate mock probability contract
        run: python tools/contract_validator.py examples/mock_pip_probability_response.json
      - name: Validate Phase 2 endpoint static contract
        run: python tools/phase2_endpoint_contract_check.py
